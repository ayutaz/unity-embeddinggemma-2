name: Artifact privacy guard
description: Stop text, filename and unreviewed-image leaks before artifact publication
inputs:
  paths:
    description: Exact newline-separated upload-artifact paths
    required: true
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      with:
        version: '0.12.20'
    - shell: bash
      working-directory: tools
      env:
        PRIVACY_ARTIFACT_PATHS: ${{ inputs.paths }}
      run: uv run --no-project --python 3.13 python -m embeddinggemma_tools.privacy_artifacts --root .. --paths "$PRIVACY_ARTIFACT_PATHS"
