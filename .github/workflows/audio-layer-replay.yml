name: Frozen native audio layer replay

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: audio-layer-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'audio-layer-replay-diagnostics'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked
      - name: Fetch only frozen stage input and output
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --locked python -m embeddinggemma_tools.artifact_zip
          --repo ayutaz/unity-embeddinggemma-2 --artifact-id 11814567883
          --output ../artifacts/frozen-audio-layer
          --member audio-runtime-stages/audio-stage-reference.json
          --member audio-runtime-stages/audio-stage-validation.json
          --member audio-runtime-stages/frames-1119-valid-1119/silence-stage-00-fp32.bin
          --member audio-runtime-stages/frames-1119-valid-1119/silence-stage-01-fp32.bin
          --member audio-runtime-reference/frames-1119-valid-1119/silence-features-fp32.bin
      - name: Verify pinned context manifests before model download
        run: |
          sha256sum --check <<'EOF'
          6620f335563a91ccc484df7d9b89d4d889e58dab4ec3d7d0389b36abe36b454a  ../artifacts/frozen-audio-layer/audio-runtime-stages/audio-stage-reference.json
          3edee8acdd9ebebb819ae488b753a3a94949b953aa0906995e516764932b0f9b  ../artifacts/frozen-audio-layer/audio-runtime-stages/audio-stage-validation.json
          366de71cb4e45e4feda58a605babe4ea9d8693a7e37e84eac0735a7c42d0ad24  ../artifacts/frozen-audio-layer/audio-runtime-reference/frames-1119-valid-1119/silence-features-fp32.bin
          EOF
      - name: Replay official layer 0 against unchanged native final
        run: >-
          uv run --locked python -m embeddinggemma_tools.audio_layer_replay
          --context ../artifacts/frozen-audio-layer/audio-runtime-stages
          --output ../artifacts/audio-layer-replay
          --reference-source 4edbe17a8105233c5aaa1514faa2862b08a4f7e0
          --diagnostic-source "$GITHUB_SHA"
          --report ../artifacts/audio-layer-replay-report.json
          --detail-feed-forward
          --detail-attention-projections
          --projection-oracle
          --compensated-projection
          --subsample-input ../artifacts/frozen-audio-layer/audio-runtime-reference/frames-1119-valid-1119/silence-features-fp32.bin
          --subsample-input-sha256 366de71cb4e45e4feda58a605babe4ea9d8693a7e37e84eac0735a7c42d0ad24
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audio-layer-replay-${{ github.sha }}
          path: |
            artifacts/audio-layer-replay/
            artifacts/audio-layer-replay-report.json
            artifacts/frozen-audio-layer/range-receipt.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
