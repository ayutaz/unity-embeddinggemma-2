name: Original audio profile structural delta

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

jobs:
  compare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.label.name == 'audio-profile-delta')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked
      - name: Download only the two immutable original profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked python -m embeddinggemma_tools.artifact_zip \
            --repo ayutaz/unity-embeddinggemma-2 --artifact-id 11814567883 \
            --output ../artifacts/original-profiles --max-entry-bytes 1300000000 \
            --member audio-runtime-reference/frames-1119-valid-1119/audio.onnx \
            --member audio-runtime-reference/frames-1119-valid-839/audio.onnx
          git rev-parse HEAD > ../artifacts/original-profiles/producer-source.txt
      - name: Compare topology and bounded profile constants without inference
        run: >-
          uv run --locked python -m embeddinggemma_tools.audio_profile_delta
          --source ../artifacts/original-profiles/audio-runtime-reference/frames-1119-valid-1119/audio.onnx
          --target ../artifacts/original-profiles/audio-runtime-reference/frames-1119-valid-839/audio.onnx
          --source-sha256 7770a8af258f2de32c5587497b820596ea4e1ed7ec5382c3ee90eada2bec7e4a
          --target-sha256 af2e97b777349fa2e5f74790d24bb4b2d899c6a8438f372253737bc5940944c7
          --output ../artifacts/audio-original-profile-delta.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audio-original-profile-delta
          path: |
            artifacts/audio-original-profile-delta.json
            artifacts/original-profiles/range-receipt.json
            artifacts/original-profiles/producer-source.txt
          if-no-files-found: error
          retention-days: 7
