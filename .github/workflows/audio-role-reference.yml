name: Frozen audio role reference

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: audio-role-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'audio-role-reference'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked
      - name: Fetch fixed native encoder files
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --locked python -m embeddinggemma_tools.artifact_zip
          --repo ayutaz/unity-embeddinggemma-2 --artifact-id 11814567883
          --output ../artifacts/fixed-audio-native --max-entry-bytes 2147483648
          --member audio-runtime-reference/audio-encoder-reference.json
          --member audio-runtime-reference/audio-encoder-validation.json
          --member audio-runtime-reference/frames-1119-valid-1119/audio.pt2
          --member audio-runtime-reference/frames-1119-valid-839/audio.pt2
          --member audio-runtime-reference/frames-1119-valid-1119/frame-mask-int32.bin
          --member audio-runtime-reference/frames-1119-valid-839/frame-mask-int32.bin
          --member audio-runtime-reference/frames-1119-valid-1119/silence-features-fp32.bin
          --member audio-runtime-reference/frames-1119-valid-1119/impulse-features-fp32.bin
          --member audio-runtime-reference/frames-1119-valid-1119/sine-features-fp32.bin
          --member audio-runtime-reference/frames-1119-valid-1119/nyquist-features-fp32.bin
          --member audio-runtime-reference/frames-1119-valid-1119/noise-features-fp32.bin
          --member audio-runtime-reference/frames-1119-valid-839/padded_noise-features-fp32.bin
      - name: Fetch fixed document backbones
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --locked python -m embeddinggemma_tools.artifact_zip
          --repo ayutaz/unity-embeddinggemma-2 --artifact-id 11814552957
          --output ../artifacts/fixed-document-backbone --max-entry-bytes 2147483648
          --member audio-embedding-reference.json
          --member audio-embedding-validation.json
          --member frames-1119-valid-1119/backbone.pt2
          --member frames-1119-valid-839/backbone.pt2
      - name: Audit pinned manifests before model download
        run: |
          sha256sum --check <<'EOF'
          ac23f39904b8149dd5ccb6485afcc93d96047f0977b5faf1d640c8bd018c13c9  ../artifacts/fixed-audio-native/audio-runtime-reference/audio-encoder-reference.json
          68d29c96012ef0a44114f2d3edbbff8d14e116ac697abee1a36d0b212155cfa1  ../artifacts/fixed-audio-native/audio-runtime-reference/audio-encoder-validation.json
          281d12573b431667e8841033db1c6a10dce4382ef98c9a5345c18044a1194001  ../artifacts/fixed-document-backbone/audio-embedding-reference.json
          9173afd593113769ed9fb9518c6092ac532d0cb055fc8f97eea2de811248e413  ../artifacts/fixed-document-backbone/audio-embedding-validation.json
          EOF
      - name: Compare every role against official real-model forward
        run: |
          for role in document query raw; do
            uv run --locked python -m embeddinggemma_tools prepare-audio-embeddings \
              --encoder-source ../artifacts/fixed-audio-native/audio-runtime-reference \
              --encoder-source-commit 4edbe17a8105233c5aaa1514faa2862b08a4f7e0 \
              --backbone-source ../artifacts/fixed-document-backbone \
              --revision 914f7f89142e33e77833254d9c9b90c3cef7303b \
              --role "$role" --output "../artifacts/audio-role-reference/$role"
          done
      - name: Record reference-only scope
        if: always()
        run: |
          {
            echo '### Fixed encoder/backbone → role-specific official Python vectors'
            echo 'Encoder ONNX/Sentis numerical failures and Unity full-chain acceptance remain separate.'
            echo 'Only completed validation JSON establishes a role reference result.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audio-role-reference-${{ github.sha }}
          path: |
            artifacts/audio-role-reference/**/*.json
            artifacts/audio-role-reference/**/*-features-fp32.bin
            artifacts/audio-role-reference/**/*-actual-fp32.bin
            artifacts/fixed-audio-native/range-receipt.json
            artifacts/fixed-document-backbone/range-receipt.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
