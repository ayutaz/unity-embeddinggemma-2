name: Fixed CI audio subsample ONNX probe

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-audio-subsample-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'ci-audio-subsample-probe'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked
      - name: Fetch only the fixed 6 MB failing prefix and native evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --locked python -m embeddinggemma_tools.artifact_zip
          --repo ayutaz/unity-embeddinggemma-2 --artifact-id 11986081282
          --output ../artifacts/fixed-subsample
          --member frames-1119-valid-1119/audio-onnx-subsample-stages.onnx
          --member frames-1119-valid-1119/audio-subsample-native_input.bin
          --member frames-1119-valid-1119/audio-subsample-frame_mask.bin
          --member frames-1119-valid-1119/audio-subsample-native_subsample.bin
      - name: Compare bounded FP32 candidates to the unchanged native prefix
        run: >-
          uv run --locked python -m embeddinggemma_tools.ci_audio_subsample_probe
          --input ../artifacts/fixed-subsample/frames-1119-valid-1119
          --output ../artifacts/subsample-probe
      - name: Check artifact publication privacy
        id: privacy_upload_1
        if: always()
        uses: ./.github/actions/privacy-artifact-guard
        with:
          paths: |
            artifacts/subsample-probe/subsample-probe.json
            artifacts/subsample-probe/*-fp32.bin
            artifacts/fixed-subsample/range-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ (always()) && steps.privacy_upload_1.outcome == 'success' }}
        with:
          name: ci-audio-subsample-probe-${{ github.sha }}
          path: |
            artifacts/subsample-probe/subsample-probe.json
            artifacts/subsample-probe/*-fp32.bin
            artifacts/fixed-subsample/range-receipt.json
          retention-days: 7
          if-no-files-found: warn
