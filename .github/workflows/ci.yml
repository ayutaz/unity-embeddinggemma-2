name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      reason: ${{ steps.scope.outputs.reason }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      source_sha: ${{ steps.scope.outputs.source_sha }}
      change_digest: ${{ steps.scope.outputs.change_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
      - name: Classify the actual source-bound diff
        id: scope
        working-directory: tools
        run: uv run --no-project --python 3.13 python -m embeddinggemma_tools.ci_scope --root ..
  documentation:
    needs: changes
    if: ${{ needs.changes.outputs.mode == 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
      - name: Check documentation and publication privacy without running models
        working-directory: tools
        run: uv run --no-project --python 3.13 python -m embeddinggemma_tools.documentation_ci --root ..
        env:
          GH_TOKEN: ${{ github.token }}
  python:
    needs: changes
    if: ${{ needs.changes.outputs.mode == 'full' }}
    uses: ./.github/workflows/python-tests.yml
  workflow-lint:
    uses: ./.github/workflows/workflow-lint.yml
  model-reference:
    needs: changes
    if: ${{ needs.changes.outputs.mode == 'full' }}
    uses: ./.github/workflows/model-reference.yml
  package:
    needs: changes
    if: ${{ needs.changes.outputs.mode == 'full' }}
    uses: ./.github/workflows/package-validation.yml
  required:
    name: Required CI
    if: ${{ always() }}
    needs: [changes, documentation, python, workflow-lint, model-reference, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
      - name: Recompute selection and require every applicable check
        working-directory: tools
        run: uv run --no-project --python 3.13 python -m embeddinggemma_tools.ci --scoped --root ..
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
