name: Original-context audio prefix ONNX diagnosis

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Fixed original boundary; every probe first requires original silence final bits
        type: choice
        default: subsample
        options: [subsample, layer_0, layer_1, layer_2, layer_3, layer_4, layer_5, layer_6, layer_7, layer_8, layer_9, layer_10, layer_11, projected_features]
      case_id:
        description: Prefix or connected diagnosis case; all selects the six original cases across both fixed profiles
        type: choice
        default: silence
        options: [silence, all, impulse, sine, nyquist, noise, padded_noise]
      variant:
        description: Select one candidate for bounded whole-encoder diagnosis, or all for a prefix
        type: choice
        default: all
        options: [all, native, refined_moment, refined_mean_moment, refined_mean_moment_rms, native_silu, refined_mean_moment_rms_silu, ordered_static_linear, ordered_static_linear_refined, ordered_static_linear_attention, ordered_static_linear_all_bmm, ordered_original_primitives, ordered_original_positions, ordered_original_tanh, ordered_original_midpoint_bmm, ordered_original_stem]
      from_stage:
        description: Optional audited frozen INPUT for isolated segment diagnosis only
        type: choice
        default: none
        options: [none, subsample, layer_0, layer_1, layer_2, layer_3, layer_4, layer_5, layer_6, layer_7, layer_8, layer_9, layer_10, layer_11]
      frozen_stage_reference:
        description: Compare only against audited original stage bytes; retain current native drift separately
        type: boolean
        default: false
      primitive_replay:
        description: Compare individual ONNX operators on native inputs without injecting their results; requires from_stage
        type: boolean
        default: false
      matrix_probe:
        description: Run only the audited frozen real MatMul fixture; downloads no encoder model
        type: boolean
        default: false
      matrix_runner:
        description: Host for the small matrix-only diagnostic; does not change encoder jobs
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, windows-latest]
      chained_probe:
        description: Full12layers in connected3layer partitions; actual ONNX carry, no frozen resets
        type: boolean
        default: false
      raw_input:
        description: Prepend original feature-input stem to connected full12 diagnosis; no intermediate stage goldens downloaded
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: frozen-audio-prefix-onnx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.matrix_probe) ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'frozen-audio-prefix-onnx') ||
        contains(github.event.pull_request.labels.*.name, 'frozen-audio-layer0-onnx') ||
        contains(github.event.pull_request.labels.*.name, 'frozen-audio-layer0-fixed-reference') ||
        contains(github.event.pull_request.labels.*.name, 'frozen-audio-encoder-fixed-reference')))
    runs-on: ubuntu-latest
    # Original padded raw carry took~337/355s per3layer part and hit20minutes.
    # Extend only this measured full12/raw case; its numerical gates are unchanged.
    timeout-minutes: ${{ inputs.raw_input && inputs.chained_probe && matrix.case_id == 'padded_noise' && 35 || 20 }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case_id: ${{ fromJSON(inputs.case_id == 'all' && '["silence","impulse","sine","nyquist","noise","padded_noise"]' || format('["{0}"]', inputs.case_id || 'silence')) }}
    defaults:
      run:
        working-directory: tools
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      PROBE_STAGE: ${{ inputs.stage || (contains(github.event.pull_request.labels.*.name, 'frozen-audio-encoder-fixed-reference') && 'projected_features') || ((contains(github.event.pull_request.labels.*.name, 'frozen-audio-layer0-onnx') || contains(github.event.pull_request.labels.*.name, 'frozen-audio-layer0-fixed-reference')) && 'layer_0') || 'subsample' }}
      PROBE_VARIANT: ${{ inputs.variant || (contains(github.event.pull_request.labels.*.name, 'frozen-audio-encoder-fixed-reference') && 'refined_mean_moment') || 'all' }}
      USE_FROZEN_STAGE: ${{ inputs.frozen_stage_reference || contains(github.event.pull_request.labels.*.name, 'frozen-audio-layer0-fixed-reference') || contains(github.event.pull_request.labels.*.name, 'frozen-audio-encoder-fixed-reference') }}
      PROBE_FROM_STAGE: ${{ inputs.from_stage || 'none' }}
      PRIMITIVE_REPLAY: ${{ inputs.primitive_replay || false }}
      CHAINED_PROBE: ${{ inputs.chained_probe || false }}
      PROBE_CASE: ${{ matrix.case_id }}
      RAW_INPUT: ${{ inputs.raw_input || false }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked
      - name: Select pinned original case profile before any model download
        shell: bash
        run: |
          case "$PROBE_CASE" in
            silence|impulse|sine|nyquist|noise) profile=frames-1119-valid-1119 ;;
            padded_noise) profile=frames-1119-valid-839 ;;
            *) echo 'Unknown original audio case.' >&2; exit 1 ;;
          esac
          echo "PROBE_PROFILE=$profile" >> "$GITHUB_ENV"
          if [ "$PROBE_CASE" != silence ]; then
            if [ "$PRIMITIVE_REPLAY" = true ]; then
              case "$PROBE_VARIANT" in
                ordered_original_primitives|ordered_original_positions|ordered_original_tanh) ;;
                *) echo 'Non-silence primitive replay requires an explicit audited candidate.' >&2; exit 1 ;;
              esac
            elif [ "$PROBE_FROM_STAGE" != none ] && [ "$CHAINED_PROBE" != true ]; then
              echo 'Non-silence segments require connected or explicit primitive diagnosis.' >&2
              exit 1
            fi
          fi
      - name: Validate explicit primitive replay input boundary
        run: |
          if [ "$PROBE_VARIANT" = ordered_original_midpoint_bmm ] && [ "$CHAINED_PROBE" != true ]; then
            echo 'Midpoint candidate requires connected diagnosis.' >&2
            exit 1
          fi
          if [ "$RAW_INPUT" = true ] && [ "$CHAINED_PROBE" != true ]; then
            echo 'Raw feature input requires connected diagnosis.' >&2
            exit 1
          fi
          if [ "$PRIMITIVE_REPLAY" = true ] && [ "$PROBE_FROM_STAGE" = none ]; then
            echo 'Primitive replay requires an explicit audited input stage.' >&2
            exit 1
          fi
          if [ "$CHAINED_PROBE" = true ]; then
            if [ "$PRIMITIVE_REPLAY" = true ] || [ "$PROBE_FROM_STAGE" != subsample ] || [ "$PROBE_STAGE" != projected_features ]; then
              echo 'Chained diagnosis requires original subsample through all12layers, without primitive replay.' >&2
              exit 1
            fi
            case "$PROBE_VARIANT" in
              native|ordered_static_linear_all_bmm|ordered_original_primitives|ordered_original_positions|ordered_original_tanh|ordered_original_midpoint_bmm) ;;
              *) echo 'Chained diagnosis requires an explicit supported candidate.' >&2; exit 1 ;;
            esac
          fi
      - name: Fetch original saved graph and one fixture without Hugging Face downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --locked python -m embeddinggemma_tools.artifact_zip
          --repo ayutaz/unity-embeddinggemma-2 --artifact-id 11814567883
          --output ../artifacts/frozen-prefix-input --max-entry-bytes 2147483648
          --member audio-runtime-reference/audio-encoder-reference.json
          --member audio-runtime-reference/audio-encoder-validation.json
          --member "audio-runtime-reference/${PROBE_PROFILE}/audio.pt2"
          --member "audio-runtime-reference/${PROBE_PROFILE}/${PROBE_CASE}-features-fp32.bin"
      - name: Fetch independently audited original stage reference only when explicitly requested
        if: env.RAW_INPUT != 'true' && (env.USE_FROZEN_STAGE == 'true' || env.PROBE_FROM_STAGE != 'none')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$PROBE_STAGE" in
            subsample) stage_index=00 ;;
            projected_features) stage_index=14 ;;
            layer_*) printf -v stage_index '%02d' "$(( ${PROBE_STAGE#layer_} + 1 ))" ;;
            *) exit 1 ;;
          esac
          source_members=()
          if [ "$PROBE_FROM_STAGE" != none ]; then
            case "$PROBE_FROM_STAGE" in
              subsample) source_index=00 ;;
              layer_*) printf -v source_index '%02d' "$(( ${PROBE_FROM_STAGE#layer_} + 1 ))" ;;
              *) exit 1 ;;
            esac
            source_members=(--member "audio-runtime-stages/${PROBE_PROFILE}/${PROBE_CASE}-stage-${source_index}-fp32.bin")
          fi
          uv run --locked python -m embeddinggemma_tools.artifact_zip \
            --repo ayutaz/unity-embeddinggemma-2 --artifact-id 11814567883 \
            --output ../artifacts/frozen-stage-reference \
            --member audio-runtime-stages/audio-stage-reference.json \
            --member audio-runtime-stages/audio-stage-validation.json \
            --member "audio-runtime-stages/${PROBE_PROFILE}/${PROBE_CASE}-stage-${stage_index}-fp32.bin" \
            "${source_members[@]}"
      - name: Record actual CPU host
        run: |
          mkdir -p ../artifacts/frozen-audio-prefix-onnx
          lscpu --json > ../artifacts/frozen-audio-prefix-onnx/cpu-host.json
      - name: Diagnose fixed boundary with original live-context gate or explicit frozen stage audit
        shell: bash
        run: |
          if [ "$CHAINED_PROBE" = true ]; then
            source_args=(--frozen-stage-source ../artifacts/frozen-stage-reference/audio-runtime-stages)
            if [ "$RAW_INPUT" = true ]; then
              source_args=(--raw-input)
            fi
            uv run --locked python -m embeddinggemma_tools.frozen_audio_chained_onnx \
              --input ../artifacts/frozen-prefix-input/audio-runtime-reference \
              --output ../artifacts/frozen-audio-prefix-onnx \
              "${source_args[@]}" \
              --variant "$PROBE_VARIANT" --case "$PROBE_CASE"
            exit
          fi
          if [ "$PRIMITIVE_REPLAY" = true ]; then
            candidate_args=()
            case "$PROBE_VARIANT" in
              ordered_original_primitives|ordered_original_positions|ordered_original_tanh) candidate_args=(--variant "$PROBE_VARIANT") ;;
            esac
            uv run --locked python -m embeddinggemma_tools.audio_primitive_replay \
              --input ../artifacts/frozen-prefix-input/audio-runtime-reference \
              --output ../artifacts/frozen-audio-prefix-onnx \
              --frozen-stage-source ../artifacts/frozen-stage-reference/audio-runtime-stages \
              --from-stage "$PROBE_FROM_STAGE" --stage "$PROBE_STAGE" --case "$PROBE_CASE" "${candidate_args[@]}"
            exit
          fi
          if [ "$PROBE_FROM_STAGE" != none ]; then
            uv run --locked python -m embeddinggemma_tools.frozen_audio_segment_onnx \
              --input ../artifacts/frozen-prefix-input/audio-runtime-reference \
              --output ../artifacts/frozen-audio-prefix-onnx \
              --frozen-stage-source ../artifacts/frozen-stage-reference/audio-runtime-stages \
              --from-stage "$PROBE_FROM_STAGE" --stage "$PROBE_STAGE" --variant "$PROBE_VARIANT"
            exit
          fi
          reference_args=()
          if [ "$USE_FROZEN_STAGE" = true ]; then
            reference_args=(--frozen-stage-source ../artifacts/frozen-stage-reference/audio-runtime-stages)
          fi
          uv run --locked python -m embeddinggemma_tools.frozen_audio_prefix_onnx \
            --input ../artifacts/frozen-prefix-input/audio-runtime-reference \
            --output ../artifacts/frozen-audio-prefix-onnx \
            --stage "$PROBE_STAGE" --variant "$PROBE_VARIANT" --case "$PROBE_CASE" "${reference_args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frozen-audio-prefix-onnx-${{ github.sha }}${{ matrix.case_id != 'silence' && format('-{0}', matrix.case_id) || '' }}
          path: |
            artifacts/frozen-audio-prefix-onnx/*.json
            artifacts/frozen-audio-prefix-onnx/*.bin
            artifacts/frozen-prefix-input/range-receipt.json
            artifacts/frozen-stage-reference/range-receipt.json
          retention-days: 7
          if-no-files-found: warn

      # Publish small numeric evidence first. Large optional graphs must not
      # prevent capture recovery when the bounded diagnostic reaches its limit.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && env.CHAINED_PROBE != 'true'
        with:
          name: frozen-audio-prefix-onnx-models-${{ github.sha }}${{ matrix.case_id != 'silence' && format('-{0}', matrix.case_id) || '' }}
          path: artifacts/frozen-audio-prefix-onnx/*.onnx
          retention-days: 7
          if-no-files-found: warn

  matrix_probe:
    if: github.event_name == 'workflow_dispatch' && inputs.matrix_probe == true
    runs-on: ${{ inputs.matrix_runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
        shell: bash
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked
      - name: Fetch only audited native primitive input coefficient and target
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --locked python -m embeddinggemma_tools.artifact_zip
          --repo ayutaz/unity-embeddinggemma-2 --artifact-id 12001831037
          --output ../artifacts/frozen-matmul-input
          --member frozen-audio-prefix-onnx/audio-primitive-replay.json
          --member frozen-audio-prefix-onnx/worst-MatMul-input0-fp32.bin
          --member frozen-audio-prefix-onnx/worst-MatMul-input1-fp32.bin
          --member frozen-audio-prefix-onnx/worst-MatMul-native-fp32.bin
      - name: Record actual CPU host
        run: |
          mkdir -p ../artifacts/frozen-matmul-probe
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command 'Get-CimInstance Win32_Processor | Select-Object Name,Manufacturer,NumberOfCores,NumberOfLogicalProcessors | ConvertTo-Json' > ../artifacts/frozen-matmul-probe/cpu-host.json
          else
            lscpu --json > ../artifacts/frozen-matmul-probe/cpu-host.json
          fi
      - name: Validate explicit FP32 FMA lowering against qualified real primitive capture
        run: >-
          uv run --locked python -m embeddinggemma_tools.frozen_matmul_probe
          --input ../artifacts/frozen-matmul-input/frozen-audio-prefix-onnx
          --output ../artifacts/frozen-matmul-probe
      - name: Compare native default and MKL AVX2 on the same small original fixture
        run: >-
          uv run --locked python -m embeddinggemma_tools.frozen_matmul_native_context
          --input ../artifacts/frozen-matmul-input/frozen-audio-prefix-onnx
          --output ../artifacts/frozen-matmul-probe/native-contexts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frozen-matmul-probe-${{ github.sha }}${{ runner.os != 'Linux' && format('-{0}', runner.os) || '' }}
          path: |
            artifacts/frozen-matmul-probe/
            artifacts/frozen-matmul-input/range-receipt.json
          retention-days: 7
          if-no-files-found: warn
