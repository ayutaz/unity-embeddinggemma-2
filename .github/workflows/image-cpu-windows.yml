name: Windows image CPU reference

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/image-cpu-windows.yml
      - .github/actions/privacy-artifact-guard/**
      - tools/embeddinggemma_tools/image_cpu_reference.py
      - tools/embeddinggemma_tools/image_reference_*.py
      - tools/embeddinggemma_tools/vision_cpu_simd_reference.py
      - tools/embeddinggemma_tools/cpu_execution_context.py
      - tools/embeddinggemma_tools/cpu_progress.py
      - tools/embeddinggemma_tools/reference_cpu_performance.py
      - tools/embeddinggemma_tools/model.py
      - tools/embeddinggemma_tools/prepare.py
      - tools/embeddinggemma_tools/export.py
      - tools/embeddinggemma_tools/native_regression_distribution.py
      - tools/embeddinggemma_tools/fixtures/vision/**
      - tools/references/**
      - tools/pyproject.toml
      - tools/uv.lock
      - tools/tests/test_image_cpu_windows_workflow.py

permissions:
  contents: read

concurrency:
  group: windows-image-cpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image_cpu_windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: square
            statistics: sixteen-lane
          - profile: landscape
            statistics: native
          - profile: portrait
            statistics: native
    defaults:
      run:
        shell: bash
        working-directory: tools
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      MKL_DYNAMIC: 'FALSE'
      MKL_CBWR: COMPATIBLE
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      DNNL_MAX_CPU_ISA: AVX2
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PROFILE: ${{ matrix.profile }}
      STATISTICS_REFERENCE: ${{ matrix.statistics }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked
      - name: Fetch unchanged original image references and attribution
        run: |
          mkdir -p ../artifacts/private-image-cpu-logs
          if uv run --locked python -m embeddinggemma_tools.image_reference_distribution \
              --output ../artifacts/original-image-references \
              > ../artifacts/private-image-cpu-logs/fetch.log 2>&1; then
            echo '{"phase":"original_image_reference_fetch","success":true}'
          else
            command_status=$?
            echo '{"phase":"original_image_reference_fetch","success":false}'
            exit "$command_status"
          fi
      - name: Measure original image chain with the declared statistics policy
        run: |
          if env MKL_CBWR=COMPATIBLE uv run --locked python -m embeddinggemma_tools.image_cpu_reference measure \
              --references ../artifacts/original-image-references --profile "$PROFILE" \
              --statistics-reference "$STATISTICS_REFERENCE" \
              --output "../artifacts/image-cpu-${PROFILE}" --source "$GITHUB_SHA" \
              > ../artifacts/private-image-cpu-logs/measure.log 2>&1; then
            echo '{"phase":"original_image_measurement","success":true}'
          else
            command_status=$?
            echo '{"phase":"original_image_measurement","success":false}'
            exit "$command_status"
          fi
      - name: Independently recompute original intermediate and final capture gates
        run: |
          if uv run --locked python -m embeddinggemma_tools.image_cpu_reference audit \
              --references ../artifacts/original-image-references \
              --output "../artifacts/image-cpu-${PROFILE}" --source "$GITHUB_SHA" \
              > ../artifacts/private-image-cpu-logs/audit.log 2>&1; then
            echo '{"phase":"saved_image_capture_audit","success":true}'
          else
            command_status=$?
            echo '{"phase":"saved_image_capture_audit","success":false}'
            exit "$command_status"
          fi
      - name: Check exact image CPU numerical evidence publication privacy
        id: image_cpu_privacy
        if: always()
        uses: ./.github/actions/privacy-artifact-guard
        with:
          paths: |
            artifacts/image-cpu-${{ matrix.profile }}/*.json
            artifacts/image-cpu-${{ matrix.profile }}/*.bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ (always()) && steps.image_cpu_privacy.outcome == 'success' }}
        with:
          name: image-cpu-windows-${{ matrix.profile }}-${{ github.sha }}
          path: |
            artifacts/image-cpu-${{ matrix.profile }}/*.json
            artifacts/image-cpu-${{ matrix.profile }}/*.bin
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
