name: Model reference and export

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-name:
        description: Reference and model artifact from this exact workflow revision
        value: ${{ jobs.reference.outputs.artifact-name }}

permissions:
  contents: read

concurrency:
  group: model-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-name: m1-reference-${{ github.sha }}
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked
      - name: Generate real-model references and validate exported program
        run: uv run --locked python -m embeddinggemma_tools prepare --output ../artifacts/m1
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
      - name: Record export validation in job summary
        if: always()
        shell: bash
        working-directory: .
        run: |
          {
            if [ -f artifacts/m1/export-validation.json ]; then
              echo '### Python reference versus saved export'
              echo '```json'
              cat artifacts/m1/export-validation.json
              echo '```'
            else
              echo 'Reference/export did not complete. This is not an M1 pass.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search-reference-${{ github.sha }}
          path: |
            artifacts/m1/search-reference.json
            artifacts/m1/export-validation.json
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m1-reference-${{ github.sha }}
          path: artifacts/m1/
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn
