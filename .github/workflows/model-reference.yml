name: Model reference and export

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-name:
        description: Reference and model artifact from this exact workflow revision
        value: ${{ jobs.reference.outputs.artifact-name }}

permissions:
  contents: read

concurrency:
  group: model-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-name: m1-reference-${{ github.sha }}
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked
      - name: Generate real-model references and validate exported program
        run: uv run --locked python -m embeddinggemma_tools prepare --output ../artifacts/m1
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
      - name: Record export validation in job summary
        if: always()
        shell: bash
        working-directory: .
        run: |
          {
            if [ -f artifacts/m1/export-validation.json ]; then
              echo '### Python reference versus saved export'
              echo '```json'
              cat artifacts/m1/export-validation.json
              echo '```'
            else
              echo 'Reference/export did not complete. This is not an M1 pass.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search-reference-${{ github.sha }}
          path: |
            artifacts/m1/search-reference.json
            artifacts/m1/export-validation.json
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m1-reference-${{ github.sha }}
          path: artifacts/m1/
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn
      - name: Validate official image processor and real vision encoder / projector exports
        run: uv run --locked python -m embeddinggemma_tools prepare-vision --output ../artifacts/vision-encoder --diagnostics
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vision-diagnostics-${{ github.sha }}
          path: artifacts/vision-encoder/diagnostics/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Generate weights-free official image preprocessing fixtures
        run: |
          uv run --locked python -c 'import os; from embeddinggemma_tools.image_preprocessing import prepare_reference; prepare_reference("../artifacts/vision-encoder/processor_config.json", "../artifacts/image-preprocessing", revision="914f7f89142e33e77833254d9c9b90c3cef7303b", source_commit=os.environ["GITHUB_SHA"])'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-preprocessing-${{ github.sha }}
          path: artifacts/image-preprocessing/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Record vision-only validation scope
        if: always()
        shell: bash
        working-directory: .
        run: |
          {
            echo '### Official image processor → vision / projector (not Unity or final embedding validation)'
            if [ -f artifacts/vision-encoder/vision-validation.json ]; then
              echo '```json'
              cat artifacts/vision-encoder/vision-validation.json
              echo '```'
            else
              echo 'Vision export validation did not complete. Sentis and end-to-end image embeddings remain unverified.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: vision-encoder-${{ github.sha }}
          path: artifacts/vision-encoder/
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn
      - name: Validate real-weight multimodal backbone with long projected-feature inputs
        run: uv run --locked python -m embeddinggemma_tools prepare-backbone --output ../artifacts/multimodal-backbone
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
      - name: Record backbone-only validation scope
        if: always()
        shell: bash
        working-directory: .
        run: |
          {
            echo '### Projected features → shared backbone (not encoder or Unity validation)'
            if [ -f artifacts/multimodal-backbone/backbone-validation.json ]; then
              echo '```json'
              cat artifacts/multimodal-backbone/backbone-validation.json
              echo '```'
            else
              echo 'Backbone validation did not complete. Image/audio encoders and Sentis remain unverified.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: multimodal-backbone-${{ github.sha }}
          path: artifacts/multimodal-backbone/
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn
      - name: Validate fixed audio preprocessing against official PCM references
        run: uv run --locked python -m embeddinggemma_tools.audio --output ../artifacts/audio-preprocessing
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
      - name: Record audio preprocessing-only validation scope
        if: always()
        shell: bash
        working-directory: .
        run: |
          {
            echo '### PCM → log-magnitude mel (not encoder or Unity validation)'
            if [ -f artifacts/audio-preprocessing/audio-validation.json ]; then
              echo '```json'
              cat artifacts/audio-preprocessing/audio-validation.json
              echo '```'
            else
              echo 'Audio preprocessing validation did not complete. Audio encoder and Sentis remain unverified.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audio-preprocessing-${{ github.sha }}
          path: artifacts/audio-preprocessing/
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn
