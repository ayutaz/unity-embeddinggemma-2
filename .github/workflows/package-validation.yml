name: Package validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
      - name: Reject private data in reachable history
        working-directory: tools
        run: uv run --no-project --python 3.13 python -m embeddinggemma_tools.privacy history --root .. --revision "$PRIVACY_SOURCE_SHA"
        env:
          PRIVACY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Audit distribution and prepare a separate consumer manifest
        shell: bash
        working-directory: tools
        run: |
          mkdir -p ../artifacts/package-validation
          uv run --no-project --python 3.13 python -m embeddinggemma_tools.package \
            --consumer ../artifacts/package-validation/consumer --git-revision "$SOURCE_SHA" \
            | tee ../artifacts/package-validation/audit.json
        env:
          SOURCE_SHA: ${{ github.sha }}
      - name: Check artifact publication privacy
        id: privacy_upload_1
        if: always()
        uses: ./.github/actions/privacy-artifact-guard
        with:
          paths: artifacts/package-validation/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ (always()) && steps.privacy_upload_1.outcome == 'success' }}
        with:
          name: package-validation-${{ github.sha }}
          path: artifacts/package-validation/
          retention-days: 7
