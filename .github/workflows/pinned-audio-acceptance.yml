name: Selected audio generation against pinned original reference

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  execute:
    runs-on: ubuntu-latest
    # Previous raw noise execution exceeded 20 minutes; all five parts must finish.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case_id: [silence, impulse, sine, nyquist, noise, padded_noise]
    defaults:
      run:
        working-directory: tools
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      # Fix native BLAS branch selection across hosts / allocations; retain the
      # exact native cut-control check and the original ONNX reference tolerances.
      MKL_CBWR: COMPATIBLE
      MKL_DYNAMIC: 'FALSE'
      OPENBLAS_NUM_THREADS: '4'
      CASE_ID: ${{ matrix.case_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked
      - name: Verify reviewed selection and fetch pinned public distribution with original golden
        run: >-
          uv run --locked python -m embeddinggemma_tools.selected_audio_generation fetch-distribution
          --output ../artifacts/candidate --original ../artifacts/original --case "$CASE_ID"
      - name: Execute original raw features through all five actual ONNX parts
        run: |
          mkdir -p ../artifacts/pinned-audio
          lscpu --json > ../artifacts/pinned-audio/cpu-host.json
          uv run --locked python -m embeddinggemma_tools.frozen_audio_chained_onnx \
            --input ../artifacts/original --candidate-distribution-directory ../artifacts/candidate/audio-runtime-reference \
            --output ../artifacts/pinned-audio \
            --raw-input --variant ordered_original_midpoint_bmm --case "$CASE_ID"
      - name: Check artifact publication privacy
        id: privacy_upload_1
        if: always()
        uses: ./.github/actions/privacy-artifact-guard
        with:
          paths: |
            artifacts/pinned-audio/*.json
            artifacts/pinned-audio/*.bin
            artifacts/candidate/candidate-range-receipt.json
            artifacts/original/original-range-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ (always()) && steps.privacy_upload_1.outcome == 'success' }}
        with:
          name: pinned-audio-${{ github.sha }}-${{ matrix.case_id }}
          path: |
            artifacts/pinned-audio/*.json
            artifacts/pinned-audio/*.bin
            artifacts/candidate/candidate-range-receipt.json
            artifacts/original/original-range-receipt.json
          retention-days: 7
          if-no-files-found: error
      - name: Replay each audited encoder through explicit CPU ONNX sessions
        timeout-minutes: 12
        run: >-
          uv run --locked --group cpu-comparison python -m embeddinggemma_tools.onnx_cpu_comparison
          --chain-report ../artifacts/pinned-audio/frozen-audio-chained-onnx.json
          --original ../artifacts/original --source "$GITHUB_SHA"
          --graph-optimizations disabled --execution-schedule chain-major --node-order priority
          --output ../artifacts/pinned-cpu-onnx/cpu-onnx-replay.json
      - name: Check CPU diagnostic publication privacy
        id: privacy_cpu_upload
        if: ${{ always() }}
        uses: ./.github/actions/privacy-artifact-guard
        with:
          paths: |
            artifacts/pinned-cpu-onnx/*.json
            artifacts/pinned-cpu-onnx/*.bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && steps.privacy_cpu_upload.outcome == 'success' }}
        with:
          name: cpu-onnx-replay-${{ github.sha }}-${{ matrix.case_id }}
          path: |
            artifacts/pinned-cpu-onnx/*.json
            artifacts/pinned-cpu-onnx/*.bin
          retention-days: 7
          if-no-files-found: warn

  audit:
    needs: [execute]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.20'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pinned-audio-${{ github.sha }}-*
          path: artifacts/pinned-audio-cases
      - name: Verify reviewed selection and fetch immutable original golden
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --locked python -m embeddinggemma_tools.selected_audio_generation fetch-original-distribution
          --output ../artifacts/original
      - name: Require six complete actual carries at this execution source
        env:
          EXECUTION_SOURCE: ${{ github.sha }}
        run: >-
          uv run --locked python -m embeddinggemma_tools.selected_audio_generation audit-distribution
          --original ../artifacts/original
          --reports ../artifacts/pinned-audio-cases --source "$EXECUTION_SOURCE"
          --output ../artifacts/pinned-audio-acceptance.json
      - name: Check artifact publication privacy
        id: privacy_upload_2
        if: always()
        uses: ./.github/actions/privacy-artifact-guard
        with:
          paths: artifacts/pinned-audio-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ (always()) && steps.privacy_upload_2.outcome == 'success' }}
        with:
          name: pinned-audio-acceptance-${{ github.sha }}
          path: artifacts/pinned-audio-acceptance.json
          retention-days: 7
          if-no-files-found: warn
