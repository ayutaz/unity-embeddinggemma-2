name: Unity CPU validation (manual)

on:
  workflow_dispatch:

# Windows M1 CPU/GPUCompute acceptance runs through the local uloop harness.
# GameCI v4.4's Docker test path supports Linux; this optional job is Linux CPU only.
# A successful run here does not establish Windows/GPU compatibility or M1 completion.

permissions:
  contents: read
  actions: read

concurrency:
  group: unity-cpu-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    # Dispatch only on trusted refs: this workflow uses Unity account credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Unity license configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ] || { [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; }; then
            echo '::error::Configure Unity Repository Secrets as described in docs/ci.md. Missing credentials are not a passing Unity check.'
            exit 1
          fi
  model:
    needs: license
    uses: ./.github/workflows/model-reference.yml
  unity:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.model.outputs.artifact-name }}
          path: artifacts/m1
      - name: Stage the exported model for Sentis import
        run: |
          mkdir -p Assets/M1Generated
          cp artifacts/m1/model.pt2 Assets/M1Generated/model.pt2
      - uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.16f1
          cliVersion: v0.1.72
          testMode: editmode
          customParameters: -testCategory M1CPU
          coverageEnabled: false
          artifactsPath: artifacts/unity-linux-CPU
          githubToken: ''
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unity-linux-CPU-${{ github.sha }}
          path: |
            artifacts/unity-linux-CPU/
            Packages/packages-lock.json
          retention-days: 7
