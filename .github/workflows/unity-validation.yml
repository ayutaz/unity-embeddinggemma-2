name: Unity M1 validation

on:
  workflow_dispatch:
  pull_request:
    paths: ['Assets/Tests/**', 'Packages/**', 'tools/**', '.github/workflows/unity-validation.yml', '.github/workflows/model-reference.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: unity-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    # Never execute fork code with the repository's Unity account credentials.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Unity license configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ] || { [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; }; then
            echo '::error::Configure Unity Repository Secrets as described in docs/ci.md. Missing credentials are not a passing Unity check.'
            exit 1
          fi
  model:
    needs: license
    uses: ./.github/workflows/model-reference.yml
  unity:
    needs: model
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [CPU, GPUCompute]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.model.outputs.artifact-name }}
          path: artifacts/m1
      - name: Stage the exported model for Sentis import
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Assets/M1Generated | Out-Null
          Copy-Item -LiteralPath artifacts/m1/model.pt2 -Destination Assets/M1Generated/model.pt2
      - uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          cliVersion: v0.1.72
          testMode: editmode
          customParameters: -testCategory M1${{ matrix.backend }}
          coverageEnabled: false
          artifactsPath: artifacts/unity-${{ matrix.backend }}
          githubToken: ''
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unity-m1-${{ matrix.backend }}-${{ github.sha }}
          path: |
            artifacts/unity-${{ matrix.backend }}/
            Packages/packages-lock.json
          retention-days: 7
