name: Workflow lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate workflows with actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
